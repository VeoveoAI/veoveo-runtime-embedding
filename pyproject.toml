[project]
name = "veoveo-runtime-embedding"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = ["fastapi==0.149.0", "uvicorn==0.54.0"]

[project.optional-dependencies]
model = [
  "sentence-transformers==6.1.0; (sys_platform == 'darwin' and platform_machine == 'arm64') or (sys_platform == 'linux' and platform_machine == 'x86_64')",
  "transformers==5.20.2; (sys_platform == 'darwin' and platform_machine == 'arm64') or (sys_platform == 'linux' and platform_machine == 'x86_64')",
  "Pillow==13.0.0; (sys_platform == 'darwin' and platform_machine == 'arm64') or (sys_platform == 'linux' and platform_machine == 'x86_64')",
  "torch==2.14.1; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "torchvision==0.29.1; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "torch==2.14.1+cu130; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "torchvision==0.29.1+cu130; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv]
package = false
required-version = "==0.13.1"
environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
